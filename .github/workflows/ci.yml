name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run isolated pass/GPG and terminal integration checks
        type: boolean
        default: false

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install jsonschema==4.26.0
      - run: make schema-check

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt
      - run: make shell-check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - name: Check Go formatting
        run: make fmt-check
      - run: go vet ./...
      - name: Cross-build Android ARM64 PIE
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -buildmode=pie -o /tmp/lazypass-android .
      - run: go test -race ./...

  installer-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - run: go test -race ./internal/install

  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - name: Install integration dependencies
        run: sudo apt-get update && sudo apt-get install -y pass gnupg python3 python3-pyte
      - name: Test isolated pass/GPG and terminal workflows
        env:
          LAZYPASS_INTEGRATION: "1"
          LAZYPASS_INTEGRATION_TUI: "1"
        run: go test -count=1 -timeout=5m -run TestEphemeralVaultIntegration ./internal/vault/pass
