name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run isolated pass/GPG and terminal integration checks
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - name: Check Go formatting
        run: make fmt-check
      - run: go vet ./...
      - run: go test -race ./...

  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - name: Install integration dependencies
        run: sudo apt-get update && sudo apt-get install -y pass gnupg python3 python3-pyte
      - name: Test isolated pass/GPG and terminal workflows
        env:
          LAZYPASS_INTEGRATION: "1"
          LAZYPASS_INTEGRATION_TUI: "1"
        run: go test -count=1 -timeout=5m -run TestEphemeralVaultIntegration ./internal/vault/pass
